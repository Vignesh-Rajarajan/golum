name: pr

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test ./...
      - name: Harness race
        run: go test -race ./pkg/harness ./pkg/harness/session
      - name: Dataset validation
        run: go test ./pkg/evals/tasks/v1 ./pkg/evals/tasks/v2 ./pkg/evals -count=1
