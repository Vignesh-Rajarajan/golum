name: Bug
description: Something is broken or unexpected.
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should have happened.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead, including errors or logs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Git tag, commit, or `go version` plus `go run ./cmd/golum`.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps or command.
    validations:
      required: true
